[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-studio"
version = "0.1.1"
description = "Implicit-field lattice design and reconstruction workbench"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
lattice-studio = "lattice_studio.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = ["legacy", "manual"]
